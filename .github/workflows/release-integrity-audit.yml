name: CaoGen release integrity audit

run-name: Release integrity audit from repository contract

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caogen-release-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Verify published release against final notes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check whether the target release is published
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json contains an invalid release version"
            exit 1
          fi
          tag="v${version}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          case "$status" in
            200)
              echo 'published=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'published=false' >> "$GITHUB_OUTPUT"
              echo "::notice::${tag} is not published; strict release integrity audit is not applicable yet"
              ;;
            *)
              echo "::error::GitHub release lookup failed with HTTP ${status}"
              exit 1
              ;;
          esac
      - name: Audit the published release
        if: steps.release.outputs.published == 'true'
        run: npm run test:github-release-integrity:required
      - name: Upload the redacted audit report
        if: always() && steps.release.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caogen-release-integrity-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: test-results/github-release-audit/**
