name: CaoGen macOS Intel signed self-test

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA already present on main
        required: true
        type: string
      version:
        description: Exact package version to build
        required: true
        default: 0.1.8
        type: string

permissions:
  contents: read

concurrency:
  group: caogen-macos-x64-signed-self-test-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile, sign, and notarize Intel candidate
    runs-on: macos-15-intel
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Bind source identity
        shell: bash
        env:
          CAOGEN_BUILD_COMMIT: ${{ inputs.commit }}
          CAOGEN_BUILD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$CAOGEN_BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full lowercase SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$CAOGEN_BUILD_COMMIT" ]] || { echo "::error::checkout does not match requested commit"; exit 1; }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CAOGEN_BUILD_COMMIT" refs/remotes/origin/main || { echo "::error::commit is not present on main"; exit 1; }
          [[ "$(node -p "require('./package.json').version")" == "$CAOGEN_BUILD_VERSION" ]] || { echo "::error::package version mismatch"; exit 1; }
          git diff --exit-code
          git diff --cached --exit-code

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck and build production bundles
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build

      - name: Import macOS signing and notarization credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID_VALUE APPLE_API_ISSUER_VALUE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/caogen-self-test.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          keychain_path="$RUNNER_TEMP/caogen-self-test.keychain-db"
          keychain_guard="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          security create-keychain -p "$keychain_guard" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_guard" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_guard" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"
          echo "CAOGEN_SELF_TEST_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized Intel package
        run: |
          set -euo pipefail
          npm run prepare:native-build -- --arch x64
          npx electron-builder --config electron-builder.release.cjs --mac --x64 --publish never

      - name: Inspect signed package
        shell: bash
        env:
          CAOGEN_BUILD_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app="dist/mac/CaoGen.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app"
          spctl --assess --verbose=2 --type execute "$app"
          xcrun stapler validate "$app"
          file "$app/Contents/MacOS/CaoGen" | tee dist/macos-x64-architecture.txt
          file "$app/Contents/MacOS/CaoGen" | grep -q 'x86_64'
          shasum -a 256 \
            "dist/CaoGen-${CAOGEN_BUILD_VERSION}.dmg" \
            "dist/CaoGen-${CAOGEN_BUILD_VERSION}.dmg.blockmap" \
            "dist/CaoGen-${CAOGEN_BUILD_VERSION}-mac.zip" \
            "dist/CaoGen-${CAOGEN_BUILD_VERSION}-mac.zip.blockmap" \
            dist/latest-mac.yml > dist/SHA256SUMS-macos-x64.txt

      - name: Upload signed self-test assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caogen-macos-x64-signed-self-test-${{ inputs.commit }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            dist/CaoGen-${{ inputs.version }}.dmg
            dist/CaoGen-${{ inputs.version }}.dmg.blockmap
            dist/CaoGen-${{ inputs.version }}-mac.zip
            dist/CaoGen-${{ inputs.version }}-mac.zip.blockmap
            dist/latest-mac.yml
            dist/SHA256SUMS-macos-x64.txt
            dist/macos-x64-architecture.txt

      - name: Remove temporary macOS credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${CAOGEN_SELF_TEST_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CAOGEN_SELF_TEST_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/caogen-self-test.p12" "$RUNNER_TEMP"/AuthKey_*.p8
