name: CaoGen Windows SignPath candidate

run-name: Windows SignPath candidate - ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit SHA to build and sign
        required: true
        type: string
      publish_artifact:
        description: Upload the signed installer as a retained Actions artifact
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: caogen-windows-signpath-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build and Authenticode-sign Windows x64
    runs-on: windows-2025
    steps:
      - name: Validate exact candidate input
        shell: pwsh
        env:
          CAOGEN_COMMIT: ${{ inputs.commit }}
        run: |
          if ($env:CAOGEN_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'commit must be an exact 40-character Git SHA'
          }
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Reject a non-exact checkout
        shell: pwsh
        env:
          CAOGEN_COMMIT: ${{ inputs.commit }}
        run: |
          $Actual = git rev-parse HEAD
          if ($Actual -ne $env:CAOGEN_COMMIT.ToLowerInvariant()) { throw "The runner checked out an unexpected commit" }
      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $Required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $Missing = @($Required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($Missing.Count -gt 0) { throw "Missing required SignPath configuration: $($Missing -join ', ')" }
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Compile application
        run: npm run build
      - name: Prepare native modules
        run: npm run prepare:native-build
      - name: Build unsigned NSIS input
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.windows-preview.cjs --win nsis --x64 --publish never
      - name: Read version and stage signing input
        id: package
        shell: pwsh
        run: |
          $Package = Get-Content -Raw package.json | ConvertFrom-Json
          $Name = "CaoGen-$($Package.version)-windows-x64-unsigned-preview.exe"
          $Source = Join-Path 'dist' $Name
          if (-not (Test-Path -LiteralPath $Source)) { throw "Signing input is missing: $Source" }
          New-Item -ItemType Directory -Force -Path signpath-input | Out-Null
          Copy-Item -LiteralPath $Source -Destination (Join-Path signpath-input $Name)
          "version=$($Package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "input-name=$Name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload immutable SignPath input
        id: signing-input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caogen-windows-signpath-input-${{ inputs.commit }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: signpath-input/${{ steps.package.outputs.input-name }}
      - name: Submit SignPath signing request
        id: signpath
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signing-input.outputs.artifact-id }}
          github-token: ${{ github.token }}
          output-artifact-directory: signpath-output
          wait-for-completion-timeout-in-seconds: 1800
      - name: Verify Authenticode result
        id: signed
        shell: pwsh
        env:
          CAOGEN_VERSION: ${{ steps.package.outputs.version }}
          CAOGEN_COMMIT: ${{ inputs.commit }}
          CAOGEN_INPUT_NAME: ${{ steps.package.outputs.input-name }}
        run: |
          $Files = @(Get-ChildItem -LiteralPath signpath-output -Recurse -File -Filter '*.exe')
          if ($Files.Count -ne 1) { throw "SignPath must return exactly one executable, got $($Files.Count)" }
          $File = $Files[0]
          if ($File.Name -ne $env:CAOGEN_INPUT_NAME) { throw "SignPath returned an unexpected executable name" }
          $Signature = Get-AuthenticodeSignature -LiteralPath $File.FullName
          if ($Signature.Status -ne 'Valid') { throw "Authenticode status is $($Signature.Status)" }
          if (-not $Signature.TimeStamperCertificate) { throw 'Signed installer is not timestamped' }
          $ReleaseName = "CaoGen-$env:CAOGEN_VERSION-windows-x64-setup.exe"
          New-Item -ItemType Directory -Force -Path signed-release | Out-Null
          $ReleasePath = Join-Path signed-release $ReleaseName
          Copy-Item -LiteralPath $File.FullName -Destination $ReleasePath
          $Digest = (Get-FileHash -LiteralPath $ReleasePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Digest  $ReleaseName" | Set-Content -Encoding ascii signed-release/SHA256SUMS.txt
          @{
            version = $env:CAOGEN_VERSION
            commit = $env:CAOGEN_COMMIT.ToLowerInvariant()
            installer = $ReleaseName
            sha256 = $Digest
            authenticodeStatus = $Signature.Status.ToString()
            signerSubject = $Signature.SignerCertificate.Subject
            signerThumbprint = $Signature.SignerCertificate.Thumbprint
            timestamped = [bool]$Signature.TimeStamperCertificate
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 signed-release/PROVENANCE.json
          "release-name=$ReleaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload signed Windows candidate
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caogen-windows-x64-signed-${{ inputs.commit }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            signed-release/${{ steps.signed.outputs.release-name }}
            signed-release/SHA256SUMS.txt
            signed-release/PROVENANCE.json
