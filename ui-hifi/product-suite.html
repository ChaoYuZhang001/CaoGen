<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CaoGen 全功能高保真原型</title>
  <link rel="stylesheet" href="product-suite.css">
</head>
<body>
  <div class="app" data-mode="studio">
    <header class="titlebar">
      <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
      <button class="brand" type="button" data-page="home" aria-label="返回工作台">
        <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
        <span class="brand-name">CaoGen</span>
      </button>
      <button class="project-switcher" type="button" data-open="project-menu">
        <span class="project-dot"></span>
        <span><small>当前项目</small><strong>CaoGen Desktop</strong></span>
        <i data-lucide="chevrons-up-down"></i>
      </button>
      <div class="title-context"><span id="title-section">总览</span><i data-lucide="chevron-right"></i><strong id="title-page">交付控制台</strong></div>
      <div class="title-actions">
        <button class="sync-state" type="button" data-open="sync-detail"><span></span>本地已同步</button>
        <button class="icon-button" type="button" id="command-trigger" aria-label="全局搜索" title="全局搜索">
          <i data-lucide="search"></i><kbd>⌘ K</kbd>
        </button>
        <div class="mode-switch" role="group" aria-label="体验模式">
          <button type="button" data-mode-value="assistant" aria-pressed="false">Assistant</button>
          <button type="button" data-mode-value="studio" aria-pressed="true">Studio</button>
        </div>
        <button class="icon-button notification-button" type="button" data-open="notifications" aria-label="通知" title="通知">
          <i data-lucide="bell"></i><span class="notification-dot"></span>
        </button>
        <button class="profile-button" type="button" data-open="profile" aria-label="账户与工作区">CZ</button>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" aria-label="主导航">
        <div class="rail-group">
          <button class="rail-button active" type="button" data-page="home" title="总览"><i data-lucide="layout-dashboard"></i><span>总览</span></button>
          <button class="rail-button" type="button" data-page="assistant" title="Assistant"><i data-lucide="message-square-text"></i><span>对话</span></button>
          <button class="rail-button" type="button" data-page="projects" title="项目"><i data-lucide="folder-kanban"></i><span>项目</span></button>
          <button class="rail-button" type="button" data-page="work" title="目标与工作项"><i data-lucide="list-checks"></i><span>任务</span></button>
          <button class="rail-button" type="button" data-page="runs" title="运行与 Supervisor"><i data-lucide="activity"></i><span>运行</span></button>
          <button class="rail-button" type="button" data-page="delivery" title="产物与交付"><i data-lucide="package-check"></i><span>交付</span></button>
          <button class="rail-button" type="button" data-page="team" title="数字团队"><i data-lucide="users"></i><span>团队</span></button>
          <button class="rail-button" type="button" data-page="office" title="3D Office"><i data-lucide="building-2"></i><span>Office</span></button>
        </div>
        <div class="rail-divider"></div>
        <div class="rail-group rail-secondary">
          <button class="rail-button" type="button" data-page="routines" title="Routines"><i data-lucide="calendar-clock"></i><span>定时</span></button>
          <button class="rail-button" type="button" data-page="resources" title="资源与工作台"><i data-lucide="files"></i><span>资源</span></button>
          <button class="rail-button" type="button" data-page="extensions" title="插件、Skill 与 MCP"><i data-lucide="blocks"></i><span>扩展</span></button>
          <button class="rail-button" type="button" data-page="learning" title="记忆与学习"><i data-lucide="brain-circuit"></i><span>学习</span></button>
          <button class="rail-button" type="button" data-page="routing" title="Provider 与路由"><i data-lucide="route"></i><span>路由</span></button>
          <button class="rail-button" type="button" data-page="recovery" title="审计与恢复"><i data-lucide="shield-check"></i><span>审计</span></button>
        </div>
        <div class="rail-spacer"></div>
        <button class="rail-button" type="button" data-page="settings" title="设置"><i data-lucide="settings"></i><span>设置</span></button>
      </nav>

      <aside class="context-sidebar" aria-label="项目上下文">
        <div class="context-heading">
          <div><span class="eyebrow">SOFTWARE PROJECT</span><h2>CaoGen Desktop</h2></div>
          <button class="icon-button quiet" type="button" aria-label="项目菜单"><i data-lucide="more-horizontal"></i></button>
        </div>
        <div class="project-health"><span class="health-ring"><b>72</b></span><div><strong>交付健康度</strong><small>2 个阻塞项需要处理</small></div></div>
        <div class="context-section">
          <div class="section-label"><span>目标</span><button type="button" aria-label="新建目标"><i data-lucide="plus"></i></button></div>
          <button class="context-item selected" type="button" data-page="work"><span class="item-status running"></span><span><strong>修复登录并交付 patch</strong><small>4 / 6 工作项</small></span><em>68%</em></button>
          <button class="context-item" type="button" data-page="work"><span class="item-status warning"></span><span><strong>v0.1.7 发布准备</strong><small>等待外部条件</small></span><em>41%</em></button>
        </div>
        <div class="context-section">
          <div class="section-label"><span>进行中的运行</span><button type="button" data-page="runs">查看全部</button></div>
          <button class="run-mini" type="button" data-page="runs"><span class="avatar avatar-dev">开</span><span><strong>修复 OTP 节流</strong><small>Kimi-K2 · 运行 06:42</small></span><i data-lucide="radio"></i></button>
          <button class="run-mini" type="button" data-page="runs"><span class="avatar avatar-test">验</span><span><strong>回归测试</strong><small>等待前置任务</small></span><i data-lucide="pause"></i></button>
        </div>
        <div class="context-section recent-section">
          <div class="section-label"><span>最近</span></div>
          <button class="recent-item" type="button" data-page="assistant"><i data-lucide="message-square"></i><span>定位登录接口 429</span><time>12m</time></button>
          <button class="recent-item" type="button" data-page="delivery"><i data-lucide="git-pull-request"></i><span>导出修复 patch</span><time>1h</time></button>
          <button class="recent-item" type="button" data-page="resources"><i data-lucide="file-text"></i><span>查看 auth.service.ts</span><time>2h</time></button>
        </div>
        <div class="context-footer"><i data-lucide="hard-drive"></i><span><strong>本地优先</strong><small>1.8 GB · 7 天备份</small></span><button type="button" data-page="settings">管理</button></div>
      </aside>

      <main class="workspace" id="workspace" tabindex="-1"></main>
      <aside class="inspector" id="inspector" aria-label="详情检查器"></aside>
    </div>

    <div class="mobile-bar" aria-label="移动端导航">
      <button type="button" data-page="home"><i data-lucide="layout-dashboard"></i><span>总览</span></button>
      <button type="button" data-page="assistant"><i data-lucide="message-square-text"></i><span>对话</span></button>
      <button type="button" data-page="work"><i data-lucide="list-checks"></i><span>任务</span></button>
      <button type="button" data-page="delivery"><i data-lucide="package-check"></i><span>交付</span></button>
      <button type="button" id="mobile-more"><i data-lucide="menu"></i><span>更多</span></button>
    </div>
  </div>

  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <section class="command-palette" role="dialog" aria-modal="true" aria-labelledby="command-title">
      <div class="command-input"><i data-lucide="search"></i><input id="command-input" type="search" placeholder="搜索功能、目标、文件或运行…" autocomplete="off"><kbd>Esc</kbd></div>
      <div class="command-body">
        <div class="command-label" id="command-title">快速前往</div>
        <div id="command-results"></div>
      </div>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="detail-drawer" id="detail-drawer" aria-label="详情" aria-hidden="true"></aside>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <script async src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" onload="window.refreshIcons && refreshIcons()"></script>
  <script src="product-suite.js"></script>
</body>
</html>
